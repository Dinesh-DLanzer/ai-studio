name: Bug report
description: Something does not work as described
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping. **Never paste API keys, your session token link (`?token=...`) or client media.**
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: A test project reproduces most problems for free; say if yours was a test or real project.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: AI Studio version
      placeholder: "0.1.0 (see CHANGELOG.md)"
  - type: input
    id: env
    attributes:
      label: OS, Python and Node versions
      placeholder: "macOS 15, Python 3.12, Node 22"
  - type: textarea
    id: logs
    attributes:
      label: Terminal output or screenshot
      render: shell
