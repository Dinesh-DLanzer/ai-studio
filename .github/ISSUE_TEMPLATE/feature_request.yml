name: Feature request
description: Suggest an improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like to see?
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [Chat (Tara), Storyboard and assets, Clips and providers, Editor and export, MCP and API, Docs, Other]
